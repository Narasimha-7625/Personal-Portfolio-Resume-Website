<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="p4-code" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p4-bg)" />
  
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="10" fill="#0f172a" stroke="#9333ea" stroke-width="2" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <rect x="75" y="12" width="330" height="16" rx="4" fill="#1e293b" />
    <text x="90" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">https://dev-articles.tech/html-css-guide</text>
    
    <!-- Code Editor Mockup -->
    <rect x="25" y="48" width="430" height="210" rx="6" fill="url(#p4-code)" />
    
    <!-- Code lines -->
    <text x="45" y="80" fill="#c084fc" font-family="monospace" font-size="12">&lt;!DOCTYPE html&gt;</text>
    <text x="45" y="105" fill="#60a5fa" font-family="monospace" font-size="12">&lt;html lang=&quot;en&quot;&gt;</text>
    <text x="65" y="130" fill="#f43f5e" font-family="monospace" font-size="12">&lt;section class=&quot;box-model-demo&quot;&gt;</text>
    <text x="85" y="155" fill="#34d399" font-family="monospace" font-size="12">&lt;h2&gt;CSS Box Model &amp; Flexbox&lt;/h2&gt;</text>
    <text x="85" y="180" fill="#fbbf24" font-family="monospace" font-size="12">&lt;p&gt;Margin, Border, Padding, Content&lt;/p&gt;</text>
    <text x="65" y="205" fill="#f43f5e" font-family="monospace" font-size="12">&lt;/section&gt;</text>
    <text x="45" y="230" fill="#60a5fa" font-family="monospace" font-size="12">&lt;/html&gt;</text>

    <!-- Side highlight pill -->
    <rect x="330" y="80" width="105" height="135" rx="6" fill="#1e1b4b" stroke="#7e22ce" stroke-width="1" />
    <text x="342" y="105" fill="#d8b4fe" font-family="sans-serif" font-size="11" font-weight="bold">Unit 1 Focus:</text>
    <text x="342" y="130" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Semantic Tags</text>
    <text x="342" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="10">• CSS Selectors</text>
    <text x="342" y="170" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Box Model</text>
    <text x="342" y="190" fill="#e2e8f0" font-family="sans-serif" font-size="10">• Flex &amp; Grid</text>
  </g>
</svg>
