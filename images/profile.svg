<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="shirt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="skin-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="soft-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background Circle with subtle ring -->
  <circle cx="200" cy="200" r="190" fill="#f8fafc" stroke="#e2e8f0" stroke-width="4" />
  <circle cx="200" cy="200" r="165" fill="url(#bg-grad)" />

  <!-- Code icon floating badges -->
  <g opacity="0.2" fill="#ffffff">
    <text x="65" y="110" font-family="monospace" font-size="28" font-weight="bold">&lt;/&gt;</text>
    <text x="300" y="140" font-family="monospace" font-size="24" font-weight="bold">{ ; }</text>
    <text x="75" y="270" font-family="monospace" font-size="22" font-weight="bold">#css</text>
  </g>

  <!-- Avatar body -->
  <g filter="url(#soft-shadow)">
    <!-- Shoulders / Torso -->
    <path d="M100,340 C100,270 140,240 200,240 C260,240 300,270 300,340 Z" fill="url(#shirt-grad)" />
    <!-- Collar / Tie accent -->
    <polygon points="200,240 185,275 200,310 215,275" fill="#38bdf8" />
    <polygon points="185,240 200,265 215,240" fill="#ffffff" />
    <!-- Neck -->
    <rect x="180" y="200" width="40" height="48" rx="8" fill="url(#skin-grad)" />
    <!-- Head -->
    <ellipse cx="200" cy="165" rx="52" ry="60" fill="url(#skin-grad)" />
    <!-- Hair -->
    <path d="M148,155 C145,115 170,100 200,100 C235,100 255,115 252,155 C242,130 225,120 200,120 C175,120 158,132 148,155 Z" fill="#0f172a" />
    <!-- Glasses -->
    <rect x="165" y="152" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
    <rect x="207" y="152" width="28" height="20" rx="6" fill="none" stroke="#0f172a" stroke-width="4" />
    <line x1="193" y1="162" x2="207" y2="162" stroke="#0f172a" stroke-width="4" />
    <!-- Eyes -->
    <circle cx="179" cy="162" r="3" fill="#0f172a" />
    <circle cx="221" cy="162" r="3" fill="#0f172a" />
    <!-- Smile -->
    <path d="M188,194 Q200,204 212,194" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
