<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="p1-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#p1-bg)" />
  
  <!-- Browser Frame Mockup -->
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="10" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <!-- URL bar -->
    <rect x="75" y="12" width="330" height="16" rx="4" fill="#1e293b" />
    <text x="90" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">https://myportfolio.local/unit1-demo</text>
    
    <!-- Hero Mockup inside screen -->
    <rect x="20" y="44" width="440" height="216" rx="6" fill="#1e293b" />
    <rect x="40" y="65" width="160" height="18" rx="4" fill="url(#p1-accent)" />
    <rect x="40" y="95" width="220" height="8" rx="2" fill="#64748b" />
    <rect x="40" y="110" width="180" height="8" rx="2" fill="#475569" />
    <rect x="40" y="130" width="70" height="22" rx="4" fill="#6366f1" />
    <rect x="120" y="130" width="70" height="22" rx="4" fill="#334155" />
    
    <!-- Code layout columns -->
    <rect x="40" y="170" width="120" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="180" y="170" width="120" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <rect x="320" y="170" width="120" height="65" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Right Avatar mockup -->
    <circle cx="370" cy="105" r="40" fill="#312e81" stroke="#818cf8" stroke-width="2" />
    <circle cx="370" cy="95" r="16" fill="#c7d2fe" />
    <path d="M346,132 C346,115 358,110 370,110 C382,110 394,115 394,132 Z" fill="#c7d2fe" />
  </g>
</svg>
