<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="p3-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#p3-bg)" />
  
  <g transform="translate(60, 40)">
    <rect width="480" height="280" rx="10" fill="#0f172a" stroke="#0284c7" stroke-width="2" />
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="36" cy="20" r="5" fill="#f59e0b" />
    <circle cx="52" cy="20" r="5" fill="#10b981" />
    <rect x="75" y="12" width="330" height="16" rx="4" fill="#1e293b" />
    <text x="90" y="24" fill="#94a3b8" font-family="sans-serif" font-size="10">https://weather-forecast.app/dashboard</text>
    
    <!-- Weather Widget -->
    <rect x="30" y="55" width="220" height="195" rx="8" fill="#1e293b" />
    <circle cx="90" cy="115" r="28" fill="url(#sun-grad)" />
    <!-- Cloud overlapping sun -->
    <path d="M80,135 Q70,135 68,125 Q68,115 78,112 Q82,100 96,102 Q110,95 118,107 Q128,108 128,120 Q128,135 115,135 Z" fill="#e0f2fe" opacity="0.9" />
    <text x="140" y="120" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="28">26°C</text>
    <text x="140" y="140" fill="#7dd3fc" font-family="sans-serif" font-size="12">Partly Sunny</text>
    <text x="45" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="12">Humidity: 62%</text>
    <text x="45" y="210" fill="#cbd5e1" font-family="sans-serif" font-size="12">Wind: 14 km/h</text>

    <!-- Forecast Cards -->
    <g transform="translate(265, 55)">
      <rect width="185" height="55" rx="6" fill="#1e293b" />
      <text x="15" y="32" fill="#e2e8f0" font-family="sans-serif" font-size="12">Mon · Sunny</text>
      <text x="135" y="32" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">28°C</text>

      <rect y="70" width="185" height="55" rx="6" fill="#1e293b" />
      <text x="15" y="102" fill="#e2e8f0" font-family="sans-serif" font-size="12">Tue · Light Rain</text>
      <text x="135" y="102" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold">24°C</text>

      <rect y="140" width="185" height="55" rx="6" fill="#1e293b" />
      <text x="15" y="172" fill="#e2e8f0" font-family="sans-serif" font-size="12">Wed · Clear Sky</text>
      <text x="135" y="172" fill="#fde047" font-family="sans-serif" font-size="14" font-weight="bold">27°C</text>
    </g>
  </g>
</svg>
